<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WarpArc Bridge · LayerZero V2</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
	<div class="nav-brand">
		<svg width="24" height="24" viewBox="0 0 24 24" fill="none">
			<rect x="3" y="3" width="7" height="7" rx="1.5" fill="#9b6ef0"/>
			<rect x="14" y="3" width="7" height="7" rx="1.5" fill="#9b6ef0" opacity="0.5"/>
			<rect x="3" y="14" width="7" height="7" rx="1.5" fill="#10b981"/>
			<rect x="14" y="14" width="7" height="7" rx="1.5" fill="#10b981" opacity="0.5"/>
		</svg>
		WarpArc
	</div>
	<div class="nav-right">
		<div class="network-toggle">
			<span class="toggle-label">Mainnet</span>
			<label class="toggle-switch">
				<input type="checkbox" id="network-mode-toggle">
				<span class="toggle-slider"></span>
			</label>
			<span class="toggle-label">Testnet</span>
		</div>
		<span class="network-badge" id="network-badge" style="display:none">
			<span class="dot"></span> Not Connected
		</span>
		<button class="btn btn-primary btn-sm" id="connect-btn" onclick="connectWallet()">Connect Wallet</button>
	</div>
</nav>

<main>
	<div class="bridge-card">
		<div class="card-header">
			<h1>Cross-Chain Bridge</h1>
			<select id="token-select" class="chain-select" style="width:auto;padding:0.35rem 1.5rem 0.35rem 0.5rem;font-size:0.7rem">
				<option value="USDC">USDC</option>
				<option value="ABT">ABT</option>
			</select>
		</div>

		<div class="chain-selectors">
			<select id="from-chain" class="chain-select"></select>
			<div class="chain-arrow">
				<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
					<line x1="5" y1="12" x2="19" y2="12"/>
					<polyline points="12 5 19 12 12 19"/>
				</svg>
			</div>
			<select id="to-chain" class="chain-select"></select>
		</div>

		<div id="bridge-area" style="display:none">
			<div class="input-group">
				<label>Amount</label>
				<div class="input-wrap">
					<input type="text" id="amount" placeholder="0.00" autocomplete="off" spellcheck="false">
					<span class="token-tag" id="token-tag">
						<img src="https://icons-ckg.pages.dev/lz-scan/protocols/usd-coin.svg" alt="">
						<span id="token-symbol">USDC</span>
					</span>
				</div>
				<div class="balance-row">
					<span>Balance: <span id="from-balance">0.00</span></span>
					<button class="max-btn" onclick="setMax()">MAX</button>
				</div>
			</div>

			<div class="gas-estimate">
				<span>Estimated Gas Fee (ETH)</span>
				<span id="gas-fee">N/A</span>
			</div>
			<div class="gas-estimate">
				<span>Network Fee (~$0.01 USDC)</span>
				<span id="gas-fee-usdc">N/A</span>
			</div>

			<button class="bridge-btn" id="bridge-btn" onclick="bridge()" disabled>Enter amount</button>

			<div class="info-block" style="margin-top:1.25rem">
				<h3>LayerZero V2 Contracts</h3>
				<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
					<div>
						<div style="font-size:0.65rem;font-weight:600;color:var(--text3);margin-bottom:0.3rem" id="from-chain-name">Ethereum</div>
						<div class="contract-list" id="from-contracts"></div>
						<div style="font-size:0.6rem;color:var(--text3);margin-top:0.3rem">
							EID: <span id="from-eid"></span> · Chain: <span id="from-cid"></span>
						</div>
					</div>
					<div>
						<div style="font-size:0.65rem;font-weight:600;color:var(--text3);margin-bottom:0.3rem" id="to-chain-name">ARC</div>
						<div class="contract-list" id="to-contracts"></div>
						<div style="font-size:0.6rem;color:var(--text3);margin-top:0.3rem">
							EID: <span id="to-eid"></span> · Chain: <span id="to-cid"></span>
						</div>
					</div>
				</div>
			</div>

			<div class="info-block">
				<h3>Transaction History</h3>
				<div class="tx-history" id="tx-list">
					<div class="empty-state">No transactions yet</div>
				</div>
			</div>
		</div>
	</div>
</main>

<footer>
	<span>WarpArc Bridge</span>
	<div class="footer-links">
		<a href="https://status.circle.com" target="_blank" rel="noopener">System Status</a>
		<a href="https://layerzeroscan.com" target="_blank" rel="noopener">LayerZero Scan</a>
	</div>
</footer>

<div class="toast-container" id="toast-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js" integrity="sha384-gpR0Q6Hx/O+uevlbpbANbS0LWjbejPV1sqD/8w422l/fW8whGY0EPmKw3uG7ACYP" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
